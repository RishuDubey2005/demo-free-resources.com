<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Notifications - NITP Resources</title>
</head>
<body>
    <div id="loader" class="loader hidden"></div>
    <div id="header"></div>
    <script src="header.js"></script>

    <div class="notification-page">
        <h1 class="notification-title">🔔 Notifications</h1>
        <p class="notification-subtitle">Stay updated with the latest announcements</p>
        
        <div class="notification-panel">
            <div id="notification-list" class="notification-list">
                <!-- Notifications will be loaded here -->
                <div class="notification-loading">
                    <div class="loading-spinner"></div>
                    <p>Loading notifications...</p>
                </div>
            </div>
            
            <div id="load-more-container" class="load-more-container hidden">
                <button id="load-more-btn" class="load-more-btn">
                    📥 Load More Notifications
                </button>
            </div>
            
            <div id="no-more-notifications" class="no-more-notifications hidden">
                <p>✅ You've seen all notifications!</p>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script src="notifications.js"></script>
</body>
</html>
