<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lost & Found - NIT Patna</title>
</head>
<body>
    <div id="loader" class="loader hidden"></div>
    <div id="header"></div>
    <script src="header.js"></script>

    <div class="lost-found-container">
        <h1 class="lost-title">🔍 Lost & Found</h1>
        <p class="lost-subtitle">Found something on campus? Help reunite it with its owner!</p>

        <!-- Upload Button -->
        <button id="toggle-upload-btn" class="toggle-upload-btn">📤 Report a Found Item</button>

        <!-- Upload Form -->
        <div id="upload-form-container" class="upload-form-container hidden">
            <h3>📝 Item Details</h3>
            <form id="upload-form" class="upload-form" enctype="multipart/form-data">
                <div class="form-row">
                    <label>👤 Your Name *</label>
                    <input type="text" id="finder-name" placeholder="Enter your full name" required>
                </div>

                <div class="form-row">
                    <label>📱 Your Mobile *</label>
                    <input type="tel" id="finder-mobile" placeholder="10-digit mobile number" required maxlength="10">
                </div>

                <div class="form-row">
                    <label>🏠 Where You Stay *</label>
                    <input type="text" id="finder-location" placeholder="e.g., Hostel-5, Room 201" required>
                </div>

                <div class="form-row">
                    <label>📍 Where Was It Found? *</label>
                    <input type="text" id="found-location" placeholder="e.g., Near Library, Main Gate" required>
                </div>

                <div class="form-row">
                    <label>💬 Description *</label>
                    <textarea id="caption" rows="3" placeholder="Describe the item (color, type, condition...)" required></textarea>
                </div>

                <div class="form-row">
                    <label for="item-image">📸 Choose Photo *</label>
                    <input type="file" id="item-image" accept="image/*" required>
                    <small>Max 5MB. Supported: JPG, PNG, WEBP</small>
                </div>

                <!-- Image Preview -->
                <div id="image-preview-container" class="image-preview-container hidden">
                    <img id="image-preview" alt="Preview">
                    <button type="button" id="remove-preview" class="remove-preview-btn">❌</button>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="submit-btn">📤 Upload Item</button>
                    <button type="button" id="cancel-upload-btn" class="cancel-upload-btn">❌ Cancel</button>
                </div>

                <div id="upload-status" class="upload-status"></div>
            </form>
        </div>

        <!-- Items Feed -->
        <div class="items-feed">
            <h3 class="feed-title">📦 Found Items List</h3>
            <div id="items-list" class="items-list">
                <p class="loading-text">⏳ Loading items...</p>
            </div>

            <div id="load-more-container" class="load-more-container hidden">
                <button id="load-more-btn" class="load-more-btn">📥 Load More</button>
            </div>
        </div>
    </div>

    <!-- Item Detail Modal -->
    <div id="item-modal" class="modal hidden">
        <div class="modal-content modal-large">
            <span class="modal-close" onclick="closeItemModal()">×</span>
            <div id="modal-item-details"></div>
        </div>
    </div>

    <!-- Return Modal -->
    <div id="return-modal" class="modal hidden">
        <div class="modal-content modal-small">
            <span class="modal-close" onclick="closeReturnModal()">×</span>
            <h3>✅ Mark as Returned</h3>
            <p>Where/to whom was this item returned?</p>

            <div class="return-form">
                <input type="text" id="returned-to-name" placeholder="👤 Person's Name *">
                <input type="text" id="returned-to-dept" placeholder="🏢 Department/Office *">
                <input type="tel" id="returned-to-contact" placeholder="📱 Contact Number *">

                <div class="modal-buttons">
                    <button id="confirm-return-btn" class="confirm-btn">✅ Confirm</button>
                    <button onclick="closeReturnModal()" class="cancel-btn">❌ Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script type="module" src="lost-items.js"></script>
</body>
</html>
