<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login Page</title>
</head>
<body>
    <div id="loader" class="loader hidden"></div>
    <div id="header"></div>
    <script src="header.js"></script>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-icon">🔐</div>
            <h2>Login to Your Account</h2>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="l-email">📧 College Email ID</label>
                    <input type="email" id="l-email" name="email" placeholder="yourname@nitp.ac.in" required>
                </div>
                
                <div class="form-group">
                    <label for="l-password">🔑 Password</label>
                    <input type="password" id="l-password" name="password" placeholder="Enter password" required>
                </div>
                
                <div class="form-group">
                    <label for="l-role">👤 Role</label>
                    <select id="l-role" required>
                        <option value="">Select Role</option>
                        <option value="Student">Student</option>
                        <option value="Professor">Professor</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                
                <div class="auth-buttons">
                    <button type="submit" id="l-login" class="btn-primary">🚀 Login</button>
                    <a href="register.html"><button type="button" class="btn-secondary">📝 Register</button></a>
                </div>
                
                <a href="forgot.html" class="forgot-link">Forgot Password?</a>
            </form>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
</body>
</html>
