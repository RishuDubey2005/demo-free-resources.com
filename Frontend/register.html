<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Register Page</title>
</head>
<body>
    <div id="loader" class="loader hidden"></div>
    <div id="header"></div>
    <script src="header.js"></script>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-icon">📝</div>
            <h2>Create New Account</h2>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="r-username">👤 Full Name</label>
                    <input type="text" id="r-username" name="username" placeholder="Enter your name" required>
                </div>
                
                <div class="form-group">
                    <label for="r-email">📧 College Email ID</label>
                    <input type="email" id="r-email" name="email" placeholder="yourname@nitp.ac.in" required>
                </div>
                
                <div class="form-group">
                    <label for="r-password">🔑 Password</label>
                    <input type="password" id="r-password" name="password" placeholder="Create password" required>
                </div>
                
                <div class="form-group">
                    <label for="r-role">🎓 Role</label>
                    <select id="r-role" required>
                        <option value="">Select Role</option>
                        <option value="Student">Student</option>
                        <option value="Professor">Professor</option>
                    </select>
                </div>

                <div id="otp-section" class="otp-section">
                    <button type="button" id="send-otp-btn" class="btn-otp">📤 Send OTP</button>
                    <span id="otp-status"></span>
                </div>

                <div id="otp-input-section" class="hidden">
                    <div class="form-group">
                        <label for="r-otp">🔢 Enter OTP</label>
                        <input type="text" id="r-otp" name="otp" placeholder="6-digit OTP" maxlength="6">
                    </div>
                    <button type="submit" id="r-submit" class="btn-primary">✅ Verify & Register</button>
                </div>

                <div class="auth-footer">
                    <a href="login.html"><button type="button" class="btn-link">Already have account? Login</button></a>
                </div>
            </form>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
</body>
</html>
