<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Profile - NITP Resources</title>
</head>
<body>
    <div id="loader" class="loader hidden"></div>
    <div id="header"></div>
    <script src="header.js"></script>
    
    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-avatar" id="profile-avatar">S</div>
                <div class="profile-title">
                    <h2 id="profile-name">Loading...</h2>
                    <span class="profile-role" id="profile-role">Student</span>
                    <span class="profile-status" id="profile-status"></span>
                </div>
            </div>

            <!-- Block Warning (if blocked) -->
            <div id="block-warning" class="block-warning hidden">
                <span>🚫</span>
                <div>
                    <strong>Your account is blocked</strong>
                    <p id="block-reason-display"></p>
                    <small id="block-date-display"></small>
                </div>
            </div>

            <!-- Profile Info -->
            <div class="profile-info">
                <div class="info-row">
                    <span class="info-label">📧 Email:</span>
                    <span class="info-value" id="profile-email">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🏢 Branch</span>
                    <span class="info-value" id="profile-branch">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📅 Joined</span>
                    <span class="info-value" id="profile-joined">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">📞 Mobile</span>
                    <span class="info-value" id="profile-mobile">Not added</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🎫 Roll No.</span>
                    <span class="info-value" id="profile-roll">Not added</span>
                </div>
                <div class="info-row">
                    <span class="info-label">🎓 Passing Year</span>
                    <span class="info-value" id="profile-year">Not added</span>
                </div>
            </div>

            <!-- Edit Profile Section -->
            <div class="profile-edit-section">
                <h4>✏️ Edit Profile</h4>
                <div class="edit-form">
                    <div class="edit-row">
                        <label>👤 Full Name</label>
                        <input type="text" id="edit-name" placeholder="Enter your name">
                    </div>
                    <div class="edit-row">
                        <label>📞 Mobile Number</label>
                        <input type="tel" id="edit-mobile" placeholder="Enter mobile number" maxlength="10">
                    </div>
                    <div class="edit-row">
                        <label>🎫 Roll Number</label>
                        <input type="text" id="edit-roll" placeholder="Enter roll number">
                    </div>
                    <div class="edit-row">
                        <label>🎓 Passing Year</label>
                        <input type="number" id="edit-year" placeholder="e.g. 2025" min="2020" max="2035">
                    </div>
                    <button id="save-profile-btn" class="save-btn">💾 Save Changes</button>
                    <span id="save-status"></span>
                </div>
            </div>

            <button id="logout" class="logout-btn">Logout</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>
    <script src="profile.js"></script>
</body>
</html>
